<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="#1C4B3A" />
  
  <!-- White X in the center -->
  <line x1="9" y1="9" x2="23" y2="23" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  <line x1="23" y1="9" x2="9" y2="23" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  
  <!-- Gold filled circle spark at top-right tip of the X (x: 23, y: 9) -->
  <circle cx="23" cy="9" r="3.2" fill="#C9A84C" stroke="#1C4B3A" stroke-width="0.8" />
</svg>
